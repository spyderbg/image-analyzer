[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-analyzer-local"
version = "0.1.0"
description = "Create image .json sidecars using a local LM Studio vision model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.4"]

[project.scripts]
image-analyzer = "image_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
